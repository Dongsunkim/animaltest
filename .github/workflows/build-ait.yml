name: Build Apps in Toss AIT
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate app source and assets
        run: npm run check
      - name: Build AIT bundle
        run: npm run ait:build
      - name: Assert AIT exists
        run: test -f pastanimaltest.ait || find . -maxdepth 2 -type f -name '*.ait' | grep -q '.ait'
      - name: Upload AIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: pastanimaltest-ait
          path: '*.ait'
          if-no-files-found: error
