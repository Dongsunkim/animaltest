<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#251633"><title>전생에 나는 뭐였을까?</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#5c3d82 0%,#20152f 68%);color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;min-height:100vh}main{max-width:520px;margin:auto;padding:30px 18px 60px}.panel{border:1px solid #ffffff28;border-radius:25px;padding:26px 22px;background:#ffffff12;box-shadow:0 18px 42px #0002}.center{text-align:center}.tag{color:#e5c8fc;font-size:12px;font-weight:800;letter-spacing:2px}.hero{font-size:85px;margin:22px 0}h1{font-size:33px;margin:16px 0;line-height:1.4}h2{font-size:24px;line-height:1.48}.muted{color:#e0d0ea;line-height:1.7}.btn,.choice{display:block;width:100%;border:0;border-radius:16px;padding:17px 14px;font-size:17px;font-weight:700;cursor:pointer}.btn{background:#f9cd7d;color:#2c1c42;margin-top:13px}.btn.secondary{background:#ffffff1c;color:#fff;border:1px solid #ffffff2a}.choice{background:#ffffff18;border:1px solid #ffffff33;color:#fff;font-weight:500;text-align:left;margin:11px 0}.choice:active{background:#ffffff40}.progress{height:8px;background:#ffffff24;border-radius:8px;overflow:hidden;margin:24px 0}.fill{height:100%;background:#ffcf75;transition:width .2s}.card{background:#ffffff12;border-radius:20px;padding:20px;margin:18px 0;border:1px solid #f1c5ff3b}.animal{display:block;width:min(280px,75vw);height:280px;object-fit:contain;image-rendering:pixelated;margin:auto;filter:drop-shadow(0 14px 15px #10082299)}.pill{display:inline-block;border-radius:25px;background:#ffffff20;padding:8px 13px;margin:4px}.small{font-size:13px}footer{text-align:center;color:#cbbbdc;font-size:12px;line-height:1.6;margin-top:24px}[hidden]{display:none!important}@media(max-width:400px){h1{font-size:29px}.panel{padding:22px 18px}}</style></head><body><main><section id="intro" class="panel center"><div class="tag">PAST LIFE ANIMAL TEST</div><div class="hero">🔮</div><h1>전생에 나는<br>뭐였을까?</h1><p class="muted">어쩐지 낯익은 나의 본능…<br>12개의 선택으로 전생 동물 캐릭터를 찾아보세요.<br>테스트할 때마다 질문이 바뀌어요!</p><button id="start" class="btn">전생 탐험 시작하기 ✨</button><p class="muted small">재미를 위한 상상 속 성격 테스트입니다.</p></section><section id="quiz" class="panel" hidden><div class="tag" id="counter"></div><div class="progress"><div class="fill" id="bar"></div></div><h2 id="question"></h2><div id="answers"></div></section><section id="result" class="panel center" hidden><div class="tag">YOUR PAST LIFE</div><div id="picture"></div><h1 id="resultName"></h1><div class="card"><div class="muted">전생의 별명</div><h2 id="alias"></h2><p class="muted" id="desc"></p><div id="traits"></div></div><p id="message" class="muted"></p><button id="share" class="btn">친구에게 결과 공유하기</button><button id="save" class="btn secondary">결과 이미지 저장하기</button><button id="again" class="btn secondary">다른 전생 다시 찾아보기 ↻</button></section><footer>© Past Life Animal Test · 재미를 위한 오락용 테스트<br>응답 결과는 서버에 저장되지 않습니다.</footer></main><script type="module">const animals=[["fox","🦊","여우","달빛 아래의 책략가","눈치가 빠르고 기발한 생각으로 상황을 뒤집는 타입이에요.","기지,센스,호기심"],["cat","🐈","고양이","왕궁의 자유로운 방랑자","나만의 속도와 취향을 소중히 여기며 좋아하는 일에 진심이에요.","독립심,관찰력,감성"],["wolf","🐺","늑대","별빛을 따르는 수호자","믿는 사람을 끝까지 챙기고 약속을 소중히 여겨요.","의리,결단력,책임감"],["owl","🦉","부엉이","고대 숲의 현자","한발 물러나서 관찰하고 중요한 핵심을 찾아내요.","통찰,침착함,집중력"],["otter","🦦","수달","강가의 장난꾸러기 발명가","작은 일에서 재미를 찾고 사람들을 웃게 만드는 성격이에요.","유쾌함,창의력,친화력"],["rabbit","🐰","토끼","꽃길의 다정한 여행자","주변의 작은 변화를 읽고 다정하게 배려하는 사람이에요.","공감,섬세함,배려"],["bear","🐻","곰","꿀숲의 든든한 보호자","느긋하면서도 중요한 순간에는 믿음직한 힘을 발휘해요.","포용력,끈기,든든함"],["deer","🦌","사슴","새벽숲의 길잡이","분위기를 섬세하게 읽고 아름다운 순간을 잘 발견해요.","감수성,우아함,배려"],["tiger","🐯","호랑이","황금산의 용감한 대장","큰 도전을 피하지 않고 목표를 향해 씩씩하게 나아가요.","용기,추진력,자신감"],["penguin","🐧","펭귄","빙하마을의 협동대장","서로의 장점을 살려 모두가 즐겁게 함께하도록 돕는 타입이에요.","협동,성실,유머"],["panda","🐼","판다","대나무숲의 평화주의자","서두르지 않고 자신만의 리듬을 지키며 주변에 여유를 줘요.","여유,평온,균형"],["dolphin","🐬","돌고래","푸른바다의 소통왕","새로운 친구와 금방 어울리고 기분 좋은 에너지를 전해요.","소통,재치,활력"],["hedgehog","🦔","고슴도치","작은정원의 꼼꼼한 장인","작은 디테일을 놓치지 않고 소중한 것을 정성껏 지켜요.","꼼꼼함,진정성,집중"],["squirrel","🐿️","다람쥐","도토리숲의 부지런한 수집가","재미있는 계획을 세우고 차곡차곡 실천하는 준비성 만점 타입이에요.","계획성,활발함,실행력"],["lion","🦁","사자","태양초원의 따뜻한 리더","앞에 나설 용기가 있으며 함께하는 사람들의 성장을 응원해요.","리더십,당당함,관대함"]].map(([id,emoji,name,alias,desc,traits])=>({id,emoji,name,alias,desc,traits:traits.split(',')}));
const bank=["낯선 숲에 도착했다면?|owl:높은 곳에서 길을 살핀다;fox:반짝이는 단서를 조사한다;wolf:함께 온 친구를 챙긴다;cat:조용한 쉼터를 찾는다","마법 상자를 열 수 있다면?|owl:미래를 보여주는 거울;otter:끝없는 간식 주머니;cat:어디든 가는 지도;rabbit:친구에게 주는 선물","친구가 비밀을 털어놓았다면?|rabbit:끝까지 들어준다;fox:해결책을 함께 찾는다;otter:기분 전환을 시켜준다;wolf:비밀을 지켜준다","머물고 싶은 신비한 장소는?|owl:별 관측소;cat:폭신한 왕궁 침실;otter:웃음 가득한 호숫가;wolf:친구들이 모인 오두막","뜻밖의 선물을 받았다면?|fox:누가 골랐는지 궁금하다;otter:신나게 포장을 뜯는다;rabbit:감사 편지를 쓴다;cat:나중에 천천히 연다","팀에서 맡고 싶은 역할은?|owl:작전 설계;rabbit:팀원 응원;wolf:방향 결정;fox:새 아이디어 제안","새 취미를 고른다면?|owl:퍼즐 풀기;cat:나만의 공간 꾸미기;otter:친구와 야외 놀이;hedgehog:작은 소품 만들기","비 오는 날 하고 싶은 일은?|owl:빗소리를 감상한다;cat:따뜻한 이불 속에서 쉰다;otter:물웅덩이에서 논다;rabbit:우산 없는 친구를 돕는다","시간여행 문이 열렸다. 어디로?|owl:고대 도서관;fox:신비로운 시장;wolf:전설의 모험대;panda:평화로운 정원","파티에 도착하면 나는?|fox:분위기를 살핀다;otter:게임을 제안한다;dolphin:새 친구와 인사한다;cat:조용한 구석에서 쉰다","길 잃은 작은 새를 발견했다면?|rabbit:안전한 곳으로 옮긴다;fox:주변 단서를 찾는다;wolf:구조를 위해 사람을 모은다;owl:상태를 관찰한다","하루 동안 마법을 쓴다면?|owl:모든 언어 이해하기;cat:순간이동하기;otter:모두를 웃게 하기;lion:사람들의 소원 들어주기","보물지도를 발견했다면?|owl:암호를 해독한다;fox:숨겨진 지름길을 찾는다;wolf:탐험대를 꾸린다;squirrel:기록을 보관한다","마을 축제를 준비한다면?|squirrel:전체 일정을 짠다;otter:깜짝 이벤트를 만든다;penguin:모두의 참여를 돕는다;deer:예쁜 장식을 준비한다","수수께끼가 너무 어렵다면?|owl:차분하게 반복해 본다;fox:새 방법을 시도한다;dolphin:친구에게 의견을 묻는다;panda:잠깐 쉬며 생각한다","신비한 동굴에서 소리가 난다면?|owl:조심히 관찰한다;tiger:궁금해서 다가간다;bear:동료의 안전을 확인한다;rabbit:귀여운 동물인지 찾아본다","여행에 하나만 챙긴다면?|owl:오래된 일기장;fox:비밀 열쇠;rabbit:친구와 찍은 사진;otter:손에 익은 장난감","낯선 사람이 도움을 요청하면?|owl:상황부터 자세히 듣는다;fox:빠른 해결책을 떠올린다;wolf:주변 사람들과 힘을 모은다;bear:따뜻하게 안심시킨다","꿈속 시장에서 무엇을 살까?|owl:별자리 지도;fox:비밀 열쇠;otter:춤추는 악기;panda:포근한 담요","가장 듣고 싶은 칭찬은?|owl:생각이 깊구나;fox:정말 재치 있네;wolf:믿음직스럽다;dolphin:함께 있으면 즐거워","숲속 동물 회의에 참석한다면?|hedgehog:자료를 정리한다;fox:새로운 제안을 한다;lion:의견을 조율한다;panda:다과를 준비한다","별똥별이 떨어진다면?|owl:별의 궤적을 관찰한다;fox:소원을 세 가지 생각한다;dolphin:친구에게 얼른 알려준다;deer:조용히 감상한다","마법의 배를 타고 떠난다면?|owl:항로를 분석한다;tiger:숨겨진 섬을 찾는다;penguin:동료와 함께 노를 젓는다;cat:갑판에서 바람을 즐긴다","누군가 깜짝 방문했다면?|owl:이유를 묻는다;otter:장난을 친다;bear:맛있는 것을 나눈다;cat:내 공간을 정돈한다","모험대가 갈림길에 섰다면?|bear:튼튼한 다리를 점검한다;tiger:가장 높은 봉우리에 도전한다;penguin:팀원들의 의견을 모은다;squirrel:지도에 경로를 기록한다","마법의 정원에서 맡고 싶은 일은?|deer:꽃들의 작은 변화를 관찰한다;bear:정원에 쉼터를 만든다;hedgehog:희귀 씨앗을 정리한다;panda:평화로운 차를 마신다","바닷속 축제에 초대된다면?|dolphin:새 친구들과 인사한다;lion:축제 진행을 맡는다;penguin:춤을 함께 연습한다;deer:전망대에서 구경한다","보물을 나눌 때 가장 중요한 건?|lion:공평하게 기준을 정한다;bear:모두에게 먼저 선택권을 준다;hedgehog:기록을 꼼꼼히 남긴다;dolphin:나눔 파티를 연다","비밀 임무를 맡았다면?|tiger:즉시 출발한다;squirrel:필요한 물건부터 챙긴다;penguin:동료와 역할을 나눈다;panda:차분히 준비한다","숲속 공방에서 만들 물건은?|hedgehog:정교한 작은 시계;bear:튼튼한 나무 의자;lion:반짝이는 축제 깃발;deer:꽃잎 책갈피","낯선 마을에서 첫날 밤은?|dolphin:새 친구를 사귄다;squirrel:내일 계획을 세운다;panda:풍경을 천천히 즐긴다;hedgehog:마을 지도를 그린다","눈보라가 찾아오면?|penguin:모두 모여 서로 돕는다;tiger:안전한 길을 찾아 나선다;bear:따뜻한 공간을 준비한다;panda:침착하게 기다린다","별빛 공연의 무대 뒤에서?|deer:출연자를 응원한다;squirrel:시간표를 확인한다;lion:무대에 올라 인사한다;hedgehog:소품을 세심하게 고친다","신비한 호수에서 발견하고 싶은 건?|dolphin:새로운 친구의 흔적;deer:빛나는 조약돌 무늬;tiger:멀리 이어지는 탐험길;panda:평화로운 자리","친구가 도전을 시작한다면?|lion:앞에서 길을 열어 준다;penguin:함께 연습 계획을 짠다;bear:따뜻하게 격려한다;squirrel:필요한 준비물을 챙긴다","도서관 비밀 방에 있으면 좋을 책은?|tiger:모험의 역사책;hedgehog:정교한 지도 모음;deer:숲의 식물 도감;dolphin:웃긴 이야기 모음","커다란 나무 아래 모임에서?|lion:사람들을 소개한다;panda:간식을 나눠 준다;squirrel:일정을 정리한다;penguin:다 같이 노래한다","새벽에 이상한 빛을 봤다면?|deer:조심스레 관찰한다;tiger:신나게 탐험을 떠난다;dolphin:친구에게 소식을 전한다;bear:안전한 곳에서 지켜본다","마법 시장에서 하나만 산다면?|bear:튼튼한 여행 배낭;squirrel:시간을 알려주는 시계;dolphin:언제나 웃게 하는 종;panda:포근한 낮잠 베개","숲의 운동회에 참가한다면?|lion:릴레이 팀을 응원한다;tiger:높이 뛰기에 도전한다;penguin:협동 경기 전략을 짠다;hedgehog:기록을 꼼꼼히 적는다","작은 오두막을 꾸민다면?|deer:꽃과 나뭇잎 장식;panda:편안한 쿠션 가득;dolphin:친구를 위한 긴 식탁;squirrel:물건 정리 선반","신비한 편지를 받았다면?|hedgehog:봉인을 세심하게 살핀다;penguin:친구와 함께 읽는다;lion:답장을 먼저 쓴다;bear:중요한 부분부터 확인한다"].map(line=>{const [question,answers]=line.split('|');return {question,answers:answers.split(';').map(a=>{const n=a.indexOf(':');return {id:a.slice(0,n),label:a.slice(n+1)}})}});
let current=[],index=0,score={},outcome=null;
const get=id=>document.getElementById(id);
function shuffle(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function screen(id){for(const s of ['intro','quiz','result'])get(s).hidden=s!==id;scrollTo(0,0)}
function start(){current=shuffle(bank).slice(0,12).map(q=>({...q,answers:shuffle(q.answers)}));index=0;score=Object.fromEntries(animals.map(a=>[a.id,0]));outcome=null;screen('quiz');render()}
function render(){const q=current[index];get('counter').textContent='QUESTION '+(index+1)+' / '+current.length;get('bar').style.width=((index/current.length)*100)+'%';get('question').textContent=q.question;const frag=document.createDocumentFragment();for(const a of q.answers){const b=document.createElement('button');b.className='choice';b.textContent=a.label;b.addEventListener('click',()=>{score[a.id]++;index++;index===current.length?finish():render()});frag.appendChild(b)}get('answers').replaceChildren(frag)}
function finish(){const best=Math.max(...Object.values(score)),ties=animals.filter(a=>score[a.id]===best);outcome=ties[Math.floor(Math.random()*ties.length)];const img=document.createElement('img');img.alt=outcome.name+' 움직이는 동물 그림';img.className='animal';img.src='./animals/'+outcome.id+'.gif';img.onerror=()=>{get('picture').textContent=outcome.emoji};get('picture').replaceChildren(img);get('resultName').textContent='당신의 전생은 '+outcome.name+'!';get('alias').textContent=outcome.alias;get('desc').textContent=outcome.desc;get('traits').replaceChildren(...outcome.traits.map(t=>{const s=document.createElement('span');s.className='pill';s.textContent='#'+t;return s}));get('message').textContent='전생에는 '+outcome.alias+'로 모두의 기억 속에 남았을지도 몰라요.';screen('result')}
async function share(){if(!outcome)return;const text='🔮 전생의 나는 '+outcome.emoji+' '+outcome.name+'! '+outcome.alias+'\n너의 전생은 뭐였을까?';const url=location.protocol==='https:'?location.href:undefined;try{if(navigator.share){await navigator.share({title:'전생에 나는 뭐였을까?',text,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+(url?'\n'+url:''));alert('결과가 복사되었어요!')}catch(e){prompt('아래 결과를 복사하세요.',text)}}
async function saveCard(){if(!outcome)return;const c=document.createElement('canvas');c.width=900;c.height=1000;const x=c.getContext('2d');if(!x)return;const grad=x.createLinearGradient(0,0,900,1000);grad.addColorStop(0,'#67437f');grad.addColorStop(1,'#241630');x.fillStyle=grad;x.fillRect(0,0,900,1000);x.fillStyle='#ffe2a5';x.textAlign='center';x.font='bold 45px sans-serif';x.fillText('전생에 나는 뭐였을까?',450,110);const pic=get('picture').querySelector('img');try{if(pic&&pic.complete&&pic.naturalWidth)x.drawImage(pic,285,180,330,330);else throw 1}catch(e){x.font='190px sans-serif';x.fillText(outcome.emoji,450,405)}x.fillStyle='white';x.font='bold 72px sans-serif';x.fillText(outcome.name,450,570);x.font='bold 42px sans-serif';x.fillText(outcome.alias,450,655);x.font='30px sans-serif';x.fillText(outcome.traits.map(s=>'#'+s).join('  '),450,750);x.font='25px sans-serif';x.fillText('친구의 전생도 찾아보세요!',450,890);const url=c.toDataURL('image/png');try{const a=document.createElement('a');a.href=url;a.download='나의-전생-동물.png';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('이미지 저장을 지원하지 않는 환경입니다.')}}
get('start').addEventListener('click',start);get('again').addEventListener('click',start);get('share').addEventListener('click',share);get('save').addEventListener('click',saveCard);
</script></body></html>
